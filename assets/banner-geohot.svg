    <text x="678" y="276" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#59656b">08:40</text>
    <circle cx="724" cy="270" r="6" fill="#ffffff"/>
    <circle cx="724" cy="270" r="2.6" fill="#59656b"/>
    <rect x="736" y="258" width="254" height="40" rx="10" fill="#ffffff" stroke="#dfe4e1" stroke-width="1"/>
    <text x="748" y="276" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="650" fill="#202a30">海南台风过境后的灾情核查启动</text>
    <text x="748" y="291" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500" fill="#59656b">遥感影像与地面站数据同时进场</text>

