    <rect x="798" y="232" width="44" height="14" rx="7" fill="#f3f3ef" stroke="#dfe4e1" stroke-width="0.8"/>
    <text x="820" y="242" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="500" fill="#59656b">灾害事件</text>
    <rect x="908" y="232" width="62" height="14" rx="7" fill="#ffffff" stroke="#dfe4e1" stroke-width="0.8"/>
    <text x="939" y="242" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="#59656b">AI 评分 88</text>

