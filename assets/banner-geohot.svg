  <rect x="992" y="298" width="144" height="1" fill="#202a30" opacity="0.12"/>
  <rect x="992" y="306" width="66" height="4" fill="#202a30" opacity="0.22"/>
  <rect x="1066" y="306" width="70" height="4" fill="#202a30" opacity="0.22"/>
  <rect x="992" y="315" width="66" height="2" fill="#202a30" opacity="0.12"/>
  <rect x="1066" y="315" width="70" height="2" fill="#202a30" opacity="0.12"/>
  <rect x="992" y="322" width="52" height="2" fill="#202a30" opacity="0.12"/>
