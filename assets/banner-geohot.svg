    <text x="574" y="212" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500" fill="#59656b">自然地理</text>
    <text x="574" y="228" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500" fill="#59656b">人文地理</text>
    <text x="574" y="244" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500" fill="#59656b">区域地理</text>
    <text x="574" y="260" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500" fill="#59656b">地理信息技术</text>
    <text x="574" y="276" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500" fill="#59656b">野外与考察</text>
    <text x="574" y="292" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500" fill="#59656b">观点与解读</text>

