    <rect x="560" y="84" width="450" height="1" fill="#dfe4e1"/>
    <!-- 180px 粘性侧栏（按比例缩到 104） -->
    <rect x="560" y="85" width="104" height="233" fill="#f3f3ef"/>
    <rect x="664" y="85" width="1" height="233" fill="#dfe4e1"/>
    <!-- 时间轴竖线 -->
    <rect x="724" y="88" width="1" height="206" fill="#dfe4e1"/>

    <!-- 侧栏导航（精选 / 全部动态 / 热点榜 / 地理日报） -->
    <rect x="574" y="97" width="4" height="4" fill="#176b75"/>
    <text x="584" y="104" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="600" fill="#176b75">精选</text>
    <rect x="574" y="117" width="4" height="4" fill="#202a30" opacity="0.3"/>
    <text x="584" y="124" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="500" fill="#59656b">全部动态</text>
