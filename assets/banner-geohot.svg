<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GEOHOT 地理热点 — 地理垂直领域的热点追踪站">
  <defs>
    <clipPath id="shellClip"><rect x="560" y="42" width="450" height="276" rx="12"/></clipPath>
  </defs>

  <!-- 纸感底色（app.css 的 bg：#faf9f6） -->
  <rect width="1200" height="400" fill="#faf9f6"/>

  <!-- 版式骨架：左侧强调竖线 + 上下发丝线（无渐变，发丝线 1px） -->
  <rect x="56" y="48" width="3" height="302" fill="#176b75"/>
  <rect x="56" y="48" width="464" height="1" fill="#202a30" opacity="0.12"/>
  <rect x="56" y="350" width="464" height="1" fill="#202a30" opacity="0.12"/>
  <rect x="544" y="76" width="1" height="248" fill="#202a30" opacity="0.07"/>

  <!-- ============ 左侧文本区 ============ -->
  <text x="76" y="86" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#59656b">GEO VERTICAL HOTSPOT · 44 SOURCES · MIT</text>
  <text x="76" y="176" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="#202a30">GEOHOT</text>
  <text x="76" y="214" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" letter-spacing="9" fill="#59656b">地理热点</text>
  <rect x="212" y="206" width="104" height="1" fill="#dfe4e1"/>
  <text x="76" y="262" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" letter-spacing="0.5" fill="#202a30">把值得关注的地理动态，排成一条时间轴</text>
  <text x="76" y="294" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="500" fill="#59656b">44 条信源 · 教材式六分类 · 时间轴信息流 · 报纸质感日报</text>
  <rect x="76" y="364" width="6" height="6" fill="#176b75"/>
  <text x="92" y="372" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.6" fill="#59656b">geohot.local   ·   /all · /hot · /daily   ·   MIT</text>

  <!-- ============ 右侧：站点真实界面的缩略（180px 侧栏 + 单列时间轴） ============ -->
  <rect x="560" y="42" width="450" height="276" rx="12" fill="#ffffff"/>

  <g clip-path="url(#shellClip)">
