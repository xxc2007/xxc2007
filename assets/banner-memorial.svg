<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Noto+Serif+SC:wght@700;900&amp;display=swap');
    </style>
  </defs>

  <!-- 纸感底色 -->
  <rect width="1200" height="400" fill="#F0EEE6"/>

  <!-- 左侧赤陶橙竖线（编辑排版式强调） -->
  <rect x="60" y="48" width="3" height="302" fill="#D97757"/>

  <!-- 上下发丝线 -->
  <rect x="60" y="48" width="800" height="2" fill="#1F1E1D" opacity="0.12"/>
  <rect x="60" y="350" width="800" height="1" fill="#1F1E1D" opacity="0.12"/>

  <!-- 文本与图卡分隔线 -->
  <rect x="860" y="70" width="1" height="264" fill="#1F1E1D" opacity="0.08"/>

  <!-- ============ 左侧文本区 ============ -->

  <!-- 分类标签 -->
  <text x="80" y="88" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#C15F3C">PERSONAL WEB MEMORIAL · VANILLA JS · SELF-HOSTED</text>

  <!-- 主标题 -->
  <text x="80" y="184" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif" font-size="92" font-weight="900" fill="#1F1E1D" letter-spacing="-1">青山湖畔的纪念册</text>

  <!-- 英文注记 -->
  <text x="80" y="218" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#6E6A5E" letter-spacing="4">M E M O R I A L   ·   B Y   Q I N G S H A N   L A K E</text>

  <!-- 主句 -->
  <text x="80" y="268" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif" font-size="24" font-weight="700" fill="#1F1E1D" letter-spacing="1">把三年光阴放进一个可以随时回去的地址</text>

  <!-- 标语 -->
  <text x="80" y="300" font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6E6A5E">25 张校园实景摄影 · 八机位时光漫游 · 中文定位图 · 匿名留言墙</text>

  <!-- 底部元信息行 -->
  <rect x="80" y="364" width="6" height="6" fill="#D97757"/>
  <text x="96" y="372" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="12" font-weight="500" letter-spacing="2" fill="#6E6A5E">xxc2007.me   ·   EST. 1958   ·   2022–2025   ·   MIT LICENSE</text>

  <!-- ============ 右侧等高线图卡 ============ -->

  <!-- 卡片 -->
  <rect x="880" y="70" width="280" height="264" fill="#FAF9F5" stroke="#E4DFD3" stroke-width="1.5"/>

  <!-- 经纬网格 -->
  <g stroke="#1F1E1D" stroke-width="0.6" opacity="0.05">
    <line x1="936" y1="70" x2="936" y2="334"/>
    <line x1="992" y1="70" x2="992" y2="334"/>
    <line x1="1048" y1="70" x2="1048" y2="334"/>
    <line x1="1104" y1="70" x2="1104" y2="334"/>
    <line x1="880" y1="126" x2="1160" y2="126"/>
    <line x1="880" y1="182" x2="1160" y2="182"/>
    <line x1="880" y1="238" x2="1160" y2="238"/>
    <line x1="880" y1="294" x2="1160" y2="294"/>
  </g>

  <!-- 等高线 -->
  <path d="M976 138 C1002 108 1078 112 1100 144 C1118 170 1112 216 1082 234" fill="none" stroke="#D97757" stroke-width="1.4" opacity="0.35"/>
  <path d="M986 148 C1006 126 1062 128 1080 152 C1098 176 1086 212 1056 224 C1026 236 980 226 970 200 C962 180 972 160 986 148 Z" fill="none" stroke="#1F1E1D" stroke-width="1.1" opacity="0.2"/>
  <path d="M996 158 C1012 142 1048 144 1060 162 C1072 180 1062 204 1040 212 C1018 220 990 212 984 194 C980 182 988 166 996 158 Z" fill="none" stroke="#1F1E1D" stroke-width="1.1" opacity="0.28"/>
  <path d="M1006 168 C1016 158 1036 160 1042 172 C1048 184 1040 196 1026 198 C1012 200 1000 192 1000 182 C1000 176 1002 172 1006 168 Z" fill="none" stroke="#C15F3C" stroke-width="1.3" opacity="0.4"/>

  <!-- 时光漫游路线（虚线） -->
  <path d="M892 302 C930 284 946 246 996 212" fill="none" stroke="#D97757" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.65"/>

  <!-- 定位钉 -->
  <path d="M1020 152 C1010 152 1003 159 1003 168 C1003 178 1020 194 1020 194 C1020 194 1037 178 1037 168 C1037 159 1030 152 1020 152 Z" fill="#D97757"/>
  <circle cx="1020" cy="168" r="4.5" fill="#FAF9F5"/>

  <!-- 指北针 -->
  <text x="1130" y="96" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" fill="#6E6A5E">N</text>
  <path d="M1133 82 L1137 72 L1141 82 Z" fill="#6E6A5E" opacity="0.7"/>

  <!-- 比例尺 -->
  <line x1="898" y1="306" x2="938" y2="306" stroke="#6E6A5E" stroke-width="1.2"/>
  <line x1="898" y1="302" x2="898" y2="310" stroke="#6E6A5E" stroke-width="1.2"/>
  <line x1="938" y1="302" x2="938" y2="310" stroke="#6E6A5E" stroke-width="1.2"/>
  <text x="944" y="310" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#6E6A5E">500 m</text>

  <!-- 坐标 -->
  <text x="1040" y="322" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="#6E6A5E">28.7208° N · 115.9322° E</text>

  <!-- 印章「拾伍」 -->
  <rect x="1122" y="288" width="26" height="26" rx="2" fill="#C15F3C"/>
  <text x="1135" y="305" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="10" font-weight="700" fill="#FAF9F5" letter-spacing="1" text-anchor="middle">拾伍</text>
</svg>
